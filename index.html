<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pain and Fatigue Diary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Pain and Fatigue Diary</h1>
    <p class="intro">Log your pain and fatigue once a day. All data stays in this browser.</p>
  </header>

  <main>
    <!-- F1: Formular für den Tageseintrag -->
    <section id="entry-section" class="card">
      <h2>New entry</h2>

      <form id="entry-form">
        <div class="form-row">
          <label for="date-input">Date</label>
          <input type="date" id="date-input" required>
        </div>

        <div class="form-row">
          <label for="pain-input">
            Pain: <output id="pain-value" for="pain-input">0</output> / 10
          </label>
          <input type="range" id="pain-input" min="0" max="10" step="1" value="0" required>
        </div>

        <div class="form-row">
          <label for="fatigue-input">
            Fatigue: <output id="fatigue-value" for="fatigue-input">0</output> / 10
          </label>
          <input type="range" id="fatigue-input" min="0" max="10" step="1" value="0" required>
        </div>

        <div class="form-row">
          <label for="sleep-input">Sleep in hours (optional)</label>
          <input type="number" id="sleep-input" min="0" max="24" step="0.5" placeholder="e.g. 6.5">
        </div>

        <div class="form-row">
          <label for="note-input">Note (optional)</label>
          <textarea id="note-input" rows="3"></textarea>
        </div>

        <button type="submit">Save entry</button>
      </form>

      <p id="form-message" role="status"></p>
    </section>

    <!-- F6–F8: Zusammenfassung und Diagramm (kommen in späteren Schritten) -->
    <section id="results-section" class="card">
      <h2>My days</h2>

      <!-- Wird angezeigt, solange es noch keine Einträge gibt -->
      <p id="empty-message">No entries yet. Save your first day above.</p>

      <!-- F2: Tabelle aller Einträge, neuestes Datum oben -->
      <div class="table-wrapper">
        <table id="entry-table">
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Pain</th>
              <th scope="col">Fatigue</th>
              <th scope="col">Sleep (h)</th>
              <th scope="col">Note</th>
            </tr>
          </thead>
          <tbody id="entry-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- JavaScript am Ende laden, damit die HTML-Elemente schon existieren -->
  <script src="script.js"></script>
</body>
</html>
